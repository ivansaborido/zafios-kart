<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a0f4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!--PWA-->
<title>Zafios Kart</title>
<style>
:root{--ink:#1a0b2e;--gold:#ffd23f;--pink:#ff4f9a;--cyan:#2de2e6;--purple:#5b2a9a;--green:#3fcf6b;--red:#ff3b3b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:#12051f;color:#fff;font-family:"Arial Black","Arial Rounded MT Bold",Impact,system-ui,sans-serif}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#menu{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;padding:10px max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left))}
#menu.on{display:flex}
#menu.title{background:radial-gradient(ellipse at center,rgba(20,5,40,.55),rgba(20,5,40,0) 70%)}
.panel{background:linear-gradient(180deg,rgba(40,12,72,.94),rgba(20,6,40,.95));border:4px solid #fff;border-radius:22px;box-shadow:0 8px 0 #0008,0 0 0 4px var(--ink);padding:12px 16px;max-width:1000px;width:100%;max-height:100%;overflow:auto;touch-action:pan-y}
.panel *{touch-action:pan-y}
h1.logo{margin:0;font-size:clamp(38px,9vw,92px);line-height:.9;text-align:center;color:var(--gold);-webkit-text-stroke:3px var(--ink);text-shadow:0 6px 0 var(--pink),0 10px 0 var(--ink);transform:rotate(-3deg)}
.sub{font-family:system-ui,sans-serif;font-weight:800;text-align:center;font-size:clamp(12px,2.4vw,18px);text-shadow:0 2px 0 #000;margin:10px 0 2px}
h2{margin:0 0 8px;font-size:clamp(20px,4vw,32px);color:var(--gold);-webkit-text-stroke:1.5px var(--ink);text-shadow:0 3px 0 var(--ink);text-align:center}
h3{margin:8px 0 4px;color:var(--cyan);font-size:15px}
.btns{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:10px}
.b{font:inherit;font-size:clamp(13px,2.5vw,19px);padding:9px 16px;border-radius:14px;border:3px solid var(--ink);background:var(--gold);color:var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer;min-width:110px}
.b:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.b.pk{background:var(--pink);color:#fff}.b.cy{background:var(--cyan)}.b.gr{background:var(--green)}.b.gy{background:#c9c2d6}.b.sm{font-size:13px;padding:6px 10px;min-width:0}
.b .s{display:block;font-family:system-ui;font-size:11px;font-weight:700}
.grid{display:grid;gap:7px;grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
.card{background:#2b1150;border:3px solid #6c46a8;border-radius:12px;padding:5px;text-align:center;cursor:pointer;position:relative}
.card.sel{border-color:var(--gold);background:#4a1f85;box-shadow:0 0 0 3px var(--gold) inset}
.card img{width:100%;aspect-ratio:1;border-radius:9px;background:radial-gradient(#7a4fc4,#2a0f4a);display:block}
.card .n{font-size:10.5px;margin-top:3px;line-height:1.1}
.card .w{position:absolute;top:6px;left:6px;font-size:9px;background:#000a;border-radius:6px;padding:1px 4px;font-family:system-ui;font-weight:900}
.card.lock img{filter:brightness(0)}
.card .lk{position:absolute;left:0;right:0;top:20%;font-size:32px}
.selwrap{display:flex;gap:12px;align-items:stretch;width:100%}
.selwrap .left{flex:1.6;min-width:0}.selwrap .right{flex:1;min-width:190px;display:flex;flex-direction:column;gap:5px}
#prev{width:100%;height:160px;display:block;border-radius:14px;background:radial-gradient(#7a4fc4,#2a0f4a)}
.stat{display:flex;align-items:center;gap:6px;font-family:system-ui;font-weight:800;font-size:12px}
.stat span{width:80px}.bar{flex:1;height:11px;background:#0006;border-radius:8px;overflow:hidden;border:2px solid #000}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--pink))}
.desc{font-family:system-ui;font-weight:700;font-size:12.5px;color:#e8dcff;line-height:1.3}
.bigname{font-size:19px;color:var(--gold);-webkit-text-stroke:1px var(--ink)}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.tracks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tcard{background:#2b1150;border:3px solid #6c46a8;border-radius:12px;padding:6px;cursor:pointer;text-align:center}
.tcard.sel{border-color:var(--gold);background:#4a1f85}
.tcard img{width:100%;border-radius:9px;display:block}
.tcard .n{font-size:13px;margin-top:3px}.tcard .t{font-family:system-ui;font-weight:700;font-size:11px;color:#d6c6ff}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:system-ui;font-weight:800;padding:6px 0;border-bottom:2px solid #ffffff1a;font-size:14px}
table.res{width:100%;border-collapse:collapse;font-family:system-ui;font-weight:800;font-size:clamp(11px,2.1vw,15px)}
table.res td{padding:3px 6px;border-bottom:2px solid #ffffff22}
table.res tr.me{background:#ffd23f33;color:var(--gold)}
table.res td.p{font-family:"Arial Black";font-size:1.2em;width:40px;color:var(--gold)}
table.res img{width:26px;height:26px;border-radius:7px;vertical-align:middle;margin-right:6px}
.howto{font-family:system-ui;font-weight:700;font-size:13.5px;line-height:1.45;color:#efe6ff}.howto b{color:var(--gold)}
.kbd{display:inline-block;background:#fff;color:var(--ink);border-radius:6px;padding:0 5px;border:2px solid var(--ink);font-family:"Arial Black";font-size:11px}
.foot{font-family:system-ui;font-size:11px;color:#cbb8f0;text-align:center;margin-top:10px}
/* HUD */
#hudRoot{position:fixed;inset:0;pointer-events:none;z-index:10;display:none}
#hudRoot.on{display:block}
.hud{position:absolute;top:0;bottom:0;overflow:hidden}
.hud .lap{position:absolute;left:10px;top:8px;font-size:clamp(16px,3.3vw,28px);-webkit-text-stroke:1.5px var(--ink);text-shadow:0 3px 0 var(--ink)}
.hud .time{position:absolute;right:10px;top:8px;font-size:clamp(14px,2.8vw,24px);-webkit-text-stroke:1.2px var(--ink);text-shadow:0 3px 0 var(--ink);text-align:right}
.hud .coins{position:absolute;left:10px;top:44px;font-size:clamp(14px,2.8vw,22px);-webkit-text-stroke:1.2px var(--ink);text-shadow:0 3px 0 var(--ink)}
.hud .item{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:78px;height:78px;border-radius:18px;background:radial-gradient(#ffffff33,#00000088);border:4px solid #fff;box-shadow:0 0 0 3px var(--ink);display:flex;align-items:center;justify-content:center;font-size:46px;font-family:system-ui}
.hud .item .cnt{position:absolute;right:-6px;bottom:-6px;font-size:16px;background:var(--pink);border:2px solid #fff;border-radius:10px;padding:0 6px;font-family:"Arial Black"}
.hud .itemname{position:absolute;left:50%;top:88px;transform:translateX(-50%);font-size:12px;font-family:system-ui;font-weight:900;text-shadow:0 2px 0 #000;white-space:nowrap}
.hud .mini{position:absolute;left:8px;bottom:140px;width:140px;height:140px;opacity:.93}
.hud .pos{position:absolute;right:12px;bottom:140px;font-size:clamp(50px,10vw,104px);line-height:.8;color:var(--gold);-webkit-text-stroke:3px var(--ink);text-shadow:0 6px 0 var(--ink);transition:transform .15s}
.hud .pos small{font-size:.45em}
.hud .pos.pop{transform:scale(1.3)}
.hud .big{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:clamp(46px,12vw,130px);color:var(--gold);-webkit-text-stroke:4px var(--ink);text-shadow:0 8px 0 var(--pink),0 12px 0 var(--ink);display:none}
.hud .msg{position:absolute;left:0;right:0;top:21%;text-align:center;font-size:clamp(18px,4.4vw,42px);-webkit-text-stroke:2px var(--ink);text-shadow:0 4px 0 var(--ink);display:none}
.hud .bubble{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);max-width:min(560px,80%);background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:5px 12px;font-family:system-ui;font-weight:800;font-size:clamp(12px,2.3vw,17px);display:none;box-shadow:0 4px 0 #0007;text-align:center}
.hud .bubble b{color:var(--pink);font-family:"Arial Black";display:block;font-size:.78em}
.hud .paint{position:absolute;inset:0;display:none;width:100%;height:100%}
.hud .flash{position:absolute;inset:0;background:#4aa8ff;opacity:0;transition:opacity .4s}
.hud .speed{position:absolute;inset:0;opacity:0;transition:opacity .25s;background:repeating-conic-gradient(from 0deg at 50% 55%,#fff0 0deg 7deg,#ffffff22 7deg 8deg)}
.hud .drift{position:absolute;left:50%;top:44%;transform:translateX(-50%);font-size:14px;font-family:system-ui;font-weight:900;text-shadow:0 2px 0 #000;opacity:0}
.hud .balloons{position:absolute;left:10px;top:44px;font-size:26px;display:none}
.hud .wrong{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:26px;color:#ff5a5a;-webkit-text-stroke:1.5px var(--ink);display:none}
.hud .look{position:absolute;right:10px;top:54px;font-size:11px;font-family:system-ui;font-weight:900;opacity:.8;display:none}
.hud.split .item{width:58px;height:58px;font-size:34px}.hud.split .itemname{top:68px}.hud.split .mini{width:100px;height:100px;bottom:20px}.hud.split .pos{bottom:20px;font-size:clamp(40px,7vw,80px)}
.divider{position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--ink)}
body.tch .hud .pos{bottom:auto;top:58px;font-size:clamp(42px,8.5vw,78px)}
body.tch .hud .mini{bottom:auto;top:80px;width:110px;height:110px}
/* táctil */
#touch{position:fixed;inset:0;z-index:12;display:none;pointer-events:none}
#touch.on{display:block}
.tz{position:absolute;pointer-events:auto}
#steer{left:0;bottom:0;width:42%;height:64%}
#knob{position:absolute;width:146px;height:146px;border-radius:50%;border:4px solid #ffffff99;background:#ffffff1a;left:max(22px,env(safe-area-inset-left));bottom:18px}
#knob i{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px;border-radius:50%;background:#ffffffcc;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-style:normal;color:var(--ink);font-size:20px}
.tb{position:absolute;border-radius:50%;border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink);box-shadow:0 5px 0 #0009;text-align:center;line-height:1}
.tb.dn{transform:translateY(3px);box-shadow:0 2px 0 #0009;filter:brightness(1.2)}
#bAcc{right:max(16px,env(safe-area-inset-right));bottom:16px;width:100px;height:100px;background:var(--green)}
#bDrift{right:calc(max(16px,env(safe-area-inset-right)) + 108px);bottom:12px;width:84px;height:84px;background:var(--cyan)}
#bItem{right:calc(max(16px,env(safe-area-inset-right)) + 12px);bottom:126px;width:84px;height:84px;background:var(--gold);font-size:12px}
#bBrk{right:calc(max(16px,env(safe-area-inset-right)) + 104px);bottom:106px;width:60px;height:60px;background:#ff7b7b;font-size:10px}
#bShove{right:calc(max(16px,env(safe-area-inset-right)) + 104px);bottom:176px;width:66px;height:66px;background:var(--pink);color:#fff;font-size:11px}
#bPause{position:fixed;top:8px;left:50%;transform:translateX(64px);width:40px;height:40px;border-radius:12px;background:#fff3;border:2px solid #fff;color:#fff;z-index:13;font-size:18px;display:none;align-items:center;justify-content:center;pointer-events:auto}
#rot{position:fixed;inset:0;background:#1a0b2e;z-index:99;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:30px;font-size:22px}
@media (orientation:portrait) and (max-width:820px){#rot.need{display:flex}}
@media (max-height:500px){#prev{height:100px}.panel{padding:8px 10px}h2{margin-bottom:5px}.card .n{font-size:9.5px}.b{padding:7px 12px}}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1a0b2e;z-index:100;font-size:24px;flex-direction:column;gap:12px}
#loading .lb{width:240px;height:14px;border:3px solid #fff;border-radius:10px;overflow:hidden}#loading .lb i{display:block;height:100%;width:0;background:var(--gold)}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="prev" style="display:none"></canvas>
<div id="loading">Calentando motores…<div class="lb"><i id="lbar"></i></div></div>
<div id="rot"><div style="font-size:60px">📱↻</div>Gira el móvil en horizontal<br>pa correr como Dios manda</div>
<div id="hudRoot"></div>
<div id="touch">
  <div class="tz" id="steer"><div id="knob"><i>◀▶</i></div></div>
  <div class="tz tb" id="bAcc">ACELERAR</div>
  <div class="tz tb" id="bDrift">DERRAPE</div>
  <div class="tz tb" id="bItem">OBJETO</div>
  <div class="tz tb" id="bBrk">FRENO</div>
  <div class="tz tb" id="bShove">PUTEO</div>
</div>
<div id="bPause">❚❚</div>
<div id="menu"></div>

<script>
'use strict';
/* =============================================================
   ZAFIOS KART · El Planeta de los Zafios sobre ruedas
   Basado en «El Planeta de los Zafios 1», de Marco Antonio Saborido Domínguez
   ============================================================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const TAU=Math.PI*2;
function angDiff(a,b){let d=b-a;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d;}
const IS_TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(IS_TOUCH)document.body.classList.add('tch');
const NOW=()=>performance.now()/1000;

/* ---------------- app nativa (Capacitor) ---------------- */
const CAP=window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()?window.Capacitor:null;
function capPlugin(n){if(!CAP)return null;try{return (CAP.Plugins&&CAP.Plugins[n])||(CAP.registerPlugin?CAP.registerPlugin(n):null);}catch(e){return null;}}
const NTTS=capPlugin('TextToSpeech');
(function(){if(!CAP)return;try{const sb=capPlugin('StatusBar');sb&&sb.hide&&sb.hide().catch(()=>{});}catch(e){}
  try{const ka=capPlugin('KeepAwake');ka&&ka.keepAwake&&ka.keepAwake().catch(()=>{});}catch(e){}
  try{const app=capPlugin('App');app&&app.addListener&&app.addListener('backButton',()=>{if(window.onBackButton)window.onBackButton();});}catch(e){}})();

/* ---------------- guardado ---------------- */
const store={voice:true,music:true,sfx:true,auto:IS_TOUCH,assist:false,gfx:IS_TOUCH?0:1,laps:3,talk:2,unlock:{},best:{},ghost:{},cups:{},vs:{cc:1,items:'normal',cpu:1,races:4,mirror:false}};
try{const s=JSON.parse(localStorage.getItem('zafiosKart2')||'{}');for(const k in s){if(typeof s[k]==='object'&&s[k]&&!Array.isArray(s[k])&&store[k])Object.assign(store[k],s[k]);else store[k]=s[k];}}catch(e){}
function save(){try{localStorage.setItem('zafiosKart2',JSON.stringify(store));}catch(e){try{store.ghost={};localStorage.setItem('zafiosKart2',JSON.stringify(store));}catch(e2){}}}

/* =============================================================
   AUDIO
   ============================================================= */
let AC=null,master=null,musGain=null,engine=null;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=.8;master.connect(AC.destination);
  musGain=AC.createGain();musGain.gain.value=.15;musGain.connect(master);
  const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
  o.type='sawtooth';o2.type='square';o.frequency.value=60;o2.frequency.value=30;f.type='lowpass';f.frequency.value=650;g.gain.value=0;
  o.connect(f);o2.connect(f);f.connect(g);g.connect(master);o.start();o2.start();engine={o,o2,g,f};
}
function beep(f,d,type='square',v=.06,slide=0,delay=0){
  if(!AC||!store.sfx)return;const t=AC.currentTime+delay;
  try{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);}catch(e){}
}
let NB=null;
function noise(d,v=.08,fq=800,delay=0){
  if(!AC||!store.sfx)return;if(!NB){NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
  try{const n=AC.createBufferSource();n.buffer=NB;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=fq;const g=AC.createGain();const t=AC.currentTime+delay;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);n.connect(f);f.connect(g);g.connect(master);n.start(t);n.stop(t+d+.05);}catch(e){}
}
const SFX={
  count:()=>beep(440,.25,'square',.08),go:()=>beep(880,.6,'square',.09),
  coin:()=>{beep(988,.06,'square',.05);beep(1480,.12,'square',.05,0,.05)},
  box:()=>{for(let i=0;i<4;i++)beep(500+i*150,.06,'triangle',.05,0,i*.04)},
  roul:()=>beep(1200,.03,'square',.022),get:()=>{beep(660,.08,'square',.05);beep(990,.14,'square',.05,0,.07)},
  boost:()=>{beep(200,.5,'sawtooth',.06,600);noise(.4,.05,1500)},
  mini:(l)=>beep(300+l*120,.3,'sawtooth',.05,400),
  hit:()=>{beep(180,.4,'sawtooth',.09,-120);noise(.3,.1,400)},
  throw:()=>beep(700,.12,'triangle',.06,-300),
  quack:()=>{beep(620,.1,'square',.05,-250);beep(560,.12,'square',.05,-250,.13)},
  splash:()=>noise(.7,.12,600),bump:()=>{noise(.15,.08,250);beep(110,.12,'square',.05,-40)},
  lap:()=>[523,659,784,1047].forEach((f,i)=>beep(f,.14,'square',.06,0,i*.09)),
  win:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>beep(f,.18,'square',.06,0,i*.12)),
  lose:()=>[392,330,262,196].forEach((f,i)=>beep(f,.25,'triangle',.07,0,i*.18)),
  flama:()=>{beep(110,.6,'sawtooth',.07,700);beep(165,.5,'square',.04,400)},
  riada:()=>{noise(1.4,.14,300);beep(90,1,'sine',.08,-40)},
  ui:()=>beep(760,.05,'square',.04),drop:()=>beep(240,.12,'square',.05,-100),
  boom:()=>{noise(.9,.18,180);beep(70,.6,'sine',.1,-30)},
  horn:()=>{beep(330,.5,'sawtooth',.08);beep(415,.5,'sawtooth',.06)},
  trick:()=>beep(900,.12,'square',.05,300),
  neigh:()=>{beep(900,.5,'sawtooth',.05,-500);beep(1100,.3,'square',.03,-300,.1)},
  gull:()=>{beep(1400,.15,'triangle',.04,-600);beep(1500,.15,'triangle',.04,-600,.2)},
  pop:()=>{noise(.2,.12,1200);beep(600,.1,'square',.05,-300)},
  draft:()=>noise(.6,.05,3000)
};
/* música procedimental: cada circuito, su melodía */
const MUS={timer:null,step:0,tempo:1,theme:0,on:false};
const SCALES=[[0,2,4,7,9],[0,3,5,7,10],[0,2,4,5,7,9,11],[0,3,5,6,7,10],[0,1,4,5,7,8,10],[0,2,4,6,7,9,11],[0,2,3,5,7,8,10],[0,4,7,9,11]];
const ROOTS=[57,55,52,50,53,60,48,56,58,51,54,62];
const PROG=[[0,7,9,5],[0,5,7,3],[0,8,5,7],[0,3,10,7],[0,1,0,10],[0,5,9,7],[0,10,8,7],[0,4,9,5]];
function mtof(m){return 440*Math.pow(2,(m-69)/12);}
function musicStart(theme){musicStop();if(!AC||!store.music)return;MUS.theme=theme;MUS.step=0;MUS.on=true;musicTick();}
function musicStop(){MUS.on=false;clearTimeout(MUS.timer);}
function note(f,d,type,v,t){try{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(musGain);o.start(t);o.stop(t+d+.02);}catch(e){}}
function musicTick(){
  if(!MUS.on||!AC)return;const th=MUS.theme,root=ROOTS[th%ROOTS.length],sc=SCALES[th%SCALES.length],pr=PROG[th%PROG.length];
  const s=MUS.step,bar=Math.floor(s/8)%4,ch=root+pr[bar],t=AC.currentTime+.02,stepDur=.15/MUS.tempo;
  if(s%2===0)note(mtof(ch-12),stepDur*1.8,'triangle',.5,t);
  if(s%8===4)note(mtof(ch-24),stepDur*1.2,'square',.12,t);
  const seed=(s*7+bar*13+th*5)%11;
  if(seed<7){const deg=sc[(seed+bar)%sc.length];note(mtof(ch+12+deg),stepDur*.9,th%2?'square':'sawtooth',.07,t);}
  if(s%16===8)note(mtof(ch+24),stepDur*2,'triangle',.06,t);
  if(s%4===2&&NB){try{const n=AC.createBufferSource();n.buffer=NB;const g=AC.createGain();g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);n.connect(g);g.connect(musGain);n.start(t);n.stop(t+.06);}catch(e){}}
  if(s%8===0&&NB){try{const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.6,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g);g.connect(musGain);o.start(t);o.stop(t+.16);}catch(e){}}
  MUS.step++;MUS.timer=setTimeout(musicTick,stepDur*1000);
}

   VOCES: cola de frases (voz del móvil, o voz nativa en la app)
   ============================================================= */
let VOICE=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();VOICE=vs.find(v=>/es[-_]ES/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null;}catch(e){}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
const VQ={q:[],busy:false,until:0};
function voiceEnqueue(ch,text,prio){
  if(!store.voice||store.talk===0)return;
  const t=NOW();VQ.q=VQ.q.filter(e=>t-e.t<3.5);
  if(VQ.q.length>=3){VQ.q.sort((a,b)=>a.p-b.p);if(VQ.q[0].p>prio)return;VQ.q.shift();}
  VQ.q.push({ch,text,p:prio,t});voicePump();
}
function voicePump(){
  if(VQ.busy&&NOW()<VQ.until)return;VQ.busy=false;if(!VQ.q.length)return;
  VQ.q.sort((a,b)=>b.p-a.p||a.t-b.t);const e=VQ.q.shift();if(NOW()-e.t>3.5){voicePump();return;}
  VQ.busy=true;VQ.until=NOW()+1.2+e.text.length*.075;
  const txt=e.text.replace(/[«»*()]/g,'');
  const done=()=>{VQ.busy=false;setTimeout(voicePump,60);};
  if(NTTS){NTTS.speak({text:txt,lang:'es-ES',rate:clamp(e.ch.rate*1.05,.5,2),pitch:clamp(e.ch.pitch,.5,2),volume:1,category:'ambient'}).then(done).catch(done);return;}
  if('speechSynthesis' in window){try{const u=new SpeechSynthesisUtterance(txt);u.lang='es-ES';if(VOICE)u.voice=VOICE;u.pitch=clamp(e.ch.pitch,0,2);u.rate=clamp(e.ch.rate*1.08,.5,2);u.onend=done;u.onerror=done;speechSynthesis.speak(u);}catch(err){done();}}
  else done();
}
setInterval(voicePump,250);
function voiceStop(){VQ.q=[];VQ.busy=false;try{if(NTTS)NTTS.stop();else speechSynthesis.cancel();}catch(e){}}

function rollItem(pos,n,mode,battle){
  const set=ITEM_TABLES[mode]||ITEM_TABLES.normal;const p=n>1?(pos-1)/(n-1):0;
  let t=Object.assign({},set[battle?1:p<.12?0:p<.45?1:p<.78?2:3]);
  if(battle){delete t.pepino;delete t.gaviota;delete t.moritas;}
  if(pos===1)delete t.gaviota;
  let s=0;for(const k in t)s+=t[k];let r=Math.random()*s;for(const k in t){r-=t[k];if(r<=0)return k;}return 'bocata';
}

function updateHazards(t){
  if(!TR||!TR.haz)return;
  for(const h of TR.haz){const ph=t*TAU/h.period+h.seed,s=Math.sin(ph),i=h.i,p=TR.P[i],l=TR.L[i],w=TR.hw+4;
    h.x=p.x+l.x*s*w;h.z=p.z+l.z*s*w;h.y=TR.Y[i];let yy=h.y;
    if(h.kind==='gaviota'){const dive=Math.max(0,Math.sin(ph*1.7+1));yy=h.y+1+(1-dive)*8;h.low=dive>.75;if(h.g.userData.wing)h.g.userData.wing.rotation.z=Math.sin(t*14)*.5;}
    else if(h.kind==='meteorito'){const k=(t/h.period+h.seed)%1;yy=h.y+(1-k)*40;h.low=k>.9;h.x=p.x+l.x*Math.sin(h.seed*3+Math.floor(t/h.period))*TR.hw*.8;h.z=p.z+l.z*Math.sin(h.seed*3+Math.floor(t/h.period))*TR.hw*.8;if(k>.97&&!h.boomed){h.boomed=true;burst(h.x,h.y+1,h.z,'#ff7a1a',14);}if(k<.5)h.boomed=false;}
    else h.low=true;
    h.g.position.set(h.x,yy,h.z);const dir=Math.cos(ph)>0?1:-1;h.g.rotation.y=Math.atan2(l.x*dir,l.z*dir);
    if(h.g.userData.roll)h.g.userData.roll.rotation.x+=.1*dir;
  }
}

function pickTarget(k){

/* ---------------- física del kart ---------------- */
function updateKart(k,dt,inp){
  if(k.out){k.m.root.position.set(k.x,k.y,k.z);k.v=0;return;}
  const N=TR?TR.N:1;
  if(TR){const pi=k.idx;k.idx=nearestIdx(TR,k.x,k.z,k.idx,12);
    if(pi>N*.8&&k.idx<N*.2){if(k.maxIdx>N*.55){k.lap++;k.maxIdx=k.idx;onLap(k);}}
    else if(pi<N*.2&&k.idx>N*.8){k.lap--;k.maxIdx=N;}
    else if(k.idx>k.maxIdx&&k.idx-k.maxIdx<60)k.maxIdx=k.idx;}
  if(k.fall>0){k.fall-=dt;k.y-=dt*(TR&&TR.void?14:4);k.m.root.position.y=k.y;
    if(k.fall<=0){const i=(k.idx-8+N)%N;k.idx=i;k.x=TR.P[i].x;k.z=TR.P[i].z;k.y=TR.Y[i]+3;k.h=Math.atan2(TR.T[i].x,TR.T[i].z);k.v=0;k.vy=0;k.air=.5;k.inv=1.2;}return;}
  const dec=x=>Math.max(0,x-dt);
  k.spin=dec(k.spin);k.boost=dec(k.boost);k.inv=dec(k.inv);k.auto=dec(k.auto);k.paint=dec(k.paint);k.slow=dec(k.slow);k.dizzy=dec(k.dizzy);k.shrink=dec(k.shrink);k.wob=dec(k.wob);k.oroT=dec(k.oroT);k.hop=dec(k.hop);
  if(k.item==='bocataoro'&&k.oroOn&&k.oroT<=0){k.item=null;k.oroOn=false;k.itemCount=0;if(k.player)updateItemHuds();}
  if(k.roul>0){k.roul-=dt;if(k.player&&Math.floor(k.roul*14)!==Math.floor((k.roul+dt)*14)){SFX.roul();updateItemHuds(true);}if(k.roul<=0){k.roul=0;if(k.player){SFX.get();updateItemHuds();}}}
  let steer=inp.steer,acc=inp.acc,brk=inp.brk,drift=inp.drift;
  if(k.auto>0){const ai=aiDrive(k,true);steer=ai.steer;acc=1;brk=0;drift=0;}
  if(k.dizzy>0)steer+=Math.sin(RACE.t*9)*.7;
  if(k.wob>0)steer+=Math.sin(RACE.t*20)*.5;

  // velocidad máxima
  let top=k.top*RACE.cc.m*(1+k.coins*.008);
  if(!k.player)top*=k.aiSkill*k.rubber;

function collideKarts(){

function rankKarts(){
  if(RACE.battle){const al=karts.filter(k=>!k.out).sort((a,b)=>b.balloons-a.balloons);al.forEach((k,i)=>k.place=i+1);return;}
  const live=karts.filter(k=>!k.done).sort((a,b)=>b.progress-a.progress);
  const all=[...RACE.order,...live];all.forEach((k,i)=>{const prev=k.place;k.place=i+1;
    if(prev>k.place&&RACE.t>3&&!k.done){const passed=all[i+1];if(passed&&RACE.t-k.lastOver>4&&Math.random()<(k.player?.7:.3)){k.lastOver=RACE.t;talk(k,Math.random()<.5?line(k,'over'):pick(INSULT),passed);

      const v=VIEWS.find(v=>v.k===k);if(v)v.pop();}});

function togglePause(){if(!RACE.on||RACE.mode==='demo'||RACE.finished)return;RACE.paused=!RACE.paused;if(RACE.paused){MENU.reset(scrPause);musicStop();if(engine)engine.g.gain.value=0;voiceStop();}else{closeMenu();MENU.stack=[];musicStart(RACE.battle?RACE.opts.arena+4:RACE.opts.track);last=performance.now();}}

/* ---------------- series de carreras ---------------- */
function buildRoster(n){
  const hs=GAME.sel.slice(0,GAME.nP).map((s,i)=>({ch:CH[s.ch],veh:s.veh,wh:s.wh,human:i}));
  const used=new Set(hs.map(x=>x.ch.id));
  if(!SERIES.cpus||SERIES.cpus.length<n-hs.length){SERIES.cpus=CHARS.filter(c=>!used.has(c.id)&&!charLocked(c)).sort(()=>Math.random()-.5).slice(0,n-hs.length).map(c=>({ch:c,veh:CPU_VEH[c.id]||'kart',wh:pick(['normal','normal','gordas','chicas','lisas']),human:null}));}
  return [...SERIES.cpus,...hs];
}
const SERIES={list:[],i:0,points:{},cpus:null,
  start(list){this.list=list;this.i=0;this.points={};this.cpus=null;this.run();},
  run(){const t=this.list[this.i];if(t==null){MENU.show(scrTrack);return;}
    const cpuS=GAME.mode==='vs'?[.84,.93,1,1.05][GAME.cpu]:null;
    startRace({mode:GAME.mode,track:t,roster:buildRoster(12),cc:GAME.cc,mirror:GAME.mirror,items:GAME.mode==='vs'?GAME.items:'normal',cpuSkill:cpuS,laps:store.laps});},
  pickDone(t){this.list[this.i]=t;this.run();}
};
function startVS(){
  const n=GAME.races;let list;
  if(GAME.order==='orden')list=Array.from({length:n},(_,i)=>i%TRACKS.length);
  else if(GAME.order==='azar'){const all=TRACKS.map((_,i)=>i).sort(()=>Math.random()-.5);list=Array.from({length:n},(_,i)=>all[i%all.length]);}
  else list=Array(n).fill(null);
  SERIES.start(list);
}
function startCrono(){const s=GAME.sel[0];startRace({mode:'crono',track:GAME.track,roster:[{ch:CH[s.ch],veh:s.veh,wh:s.wh,human:0}],cc:2,mirror:GAME.mirror,laps:3});}
function startBattle(){SERIES.cpus=null;startRace({mode:'battle',arena:GAME.arena,roster:buildRoster(8),cc:1,items:GAME.items});}
function resTable(rows){return '<table class="res">'+rows.join('')+'</table>';}
function rowHtml(pos,k,cols,me){return `<tr class="${me?'me':''}"><td class="p">${pos}</td><td><img src="${PORTRAITS[k.ch.id]}">${k.ch.name}</td>${cols.map(c=>'<td>'+c+'</td>').join('')}</tr>`;}
function onRaceEnd(){
  $('#hudRoot').classList.remove('on');$('#touch').classList.remove('on');$('#bPause').style.display='none';
  const order=RACE.order;
  if(RACE.mode==='crono'){const key=TRACKS[RACE.opts.track].id+(RACE.opts.mirror?'m':'');MENU.reset(m=>{const p=panel(m,'Contrarreloj · '+TRACKS[RACE.opts.track].name,640);p.insertAdjacentHTML('beforeend',resTable([rowHtml('⏱️',humans[0],[fmt(humans[0].ftime)],true),`<tr><td class="p">🏅</td><td>Récord (con fantasma)</td><td>${fmt(store.best[key])}</td></tr>`]));row(p,btn('↻ Otra vez','',startCrono),btn('Otro circuito','cy',()=>MENU.reset(scrTrack)),btn('Menú','gy',toTitle));});return;}
  if(RACE.battle){MENU.reset(m=>{const p=panel(m,'🎈 Batalla · '+ARENAS[RACE.opts.arena].name,640);p.insertAdjacentHTML('beforeend',resTable(order.map((k,i)=>rowHtml((i+1)+'º',k,[k.out?'💀':'🎈'.repeat(k.balloons)],k.player))));row(p,btn('↻ Otra','pk',startBattle),btn('Otra arena','cy',()=>MENU.reset(scrArena)),btn('Menú','gy',toTitle));});return;}
  order.forEach((k,i)=>{SERIES.points[k.ch.id]=(SERIES.points[k.ch.id]||0)+PTS[i];});
  const last=SERIES.i>=SERIES.list.length-1,title=(GAME.mode==='gp'?CUPS[GAME.cup].name+' · ':'')+'Carrera '+(SERIES.i+1)+'/'+SERIES.list.length+' · '+TRACKS[RACE.opts.track].name;
  MENU.reset(m=>{const p=panel(m,title,760);
    p.insertAdjacentHTML('beforeend',resTable(order.map((k,i)=>rowHtml((i+1)+'º',k,[fmt(k.ftime),'+'+PTS[i],SERIES.points[k.ch.id]+' pts'],k.player))));
    if(!last)row(p,btn('Siguiente carrera ▶','pk',()=>{SERIES.i++;SERIES.run();}),btn('Salir','gy',toTitle));
    else row(p,btn('Clasificación final 🏆','pk',showFinal));});
}
function showFinal(){
  const st=Object.entries(SERIES.points).sort((a,b)=>b[1]-a[1]);const humanIds=GAME.sel.slice(0,GAME.nP).map(s=>s.ch);
  const best=Math.min(...humanIds.map(id=>st.findIndex(e=>e[0]===id)+1));let unlocked=null;
  if(GAME.mode==='gp'){const cup=CUPS[GAME.cup];store.cups[cup.id]=store.cups[cup.id]||{};if(best<=3&&(!store.cups[cup.id][GAME.cc]||best<store.cups[cup.id][GAME.cc]))store.cups[cup.id][GAME.cc]=best;if(best===1&&!store.unlock[cup.unlock]){store.unlock[cup.unlock]=true;unlocked=cup.prize;}save();}
  MENU.reset(m=>{const p=panel(m,best===1?'🏆 ¡CAMPEÓN!':'Clasificación final',700);
    p.insertAdjacentHTML('beforeend',resTable(st.map(([id,pts],i)=>rowHtml(['🥇','🥈','🥉'][i]||(i+1)+'º',{ch:CH[id]},[pts+' pts'],humanIds.includes(id)))));
    if(unlocked)p.insertAdjacentHTML('beforeend',`<div class="bigname" style="text-align:center;margin-top:10px">🔓 ¡Desbloqueado: ${unlocked}!</div>`);
    row(p,btn('Menú principal','pk',toTitle));});
  const w=CH[st[0][0]];voiceEnqueue(w,pick(w.q.win),2);if(best<=3)SFX.win();else SFX.lose();
}
function startDemo(){const t=Math.floor(Math.random()*TRACKS.length);const r=CHARS.filter(c=>!charLocked(c)).sort(()=>Math.random()-.5).slice(0,8).map(c=>({ch:c,veh:CPU_VEH[c.id]||'kart',wh:'normal',human:null}));startRace({mode:'demo',track:t,roster:r,cc:1,laps:3});}
function toTitle(){MENU.stack=[];musicStop();if(engine)engine.g.gain.value=0;voiceStop();startDemo();MENU.reset(scrTitle);}
