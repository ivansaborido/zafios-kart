name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Zafios_Kart.html', 'app/**', '.github/workflows/**']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Preparar Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK en $SDK"
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null

      - name: Preparar la app
        working-directory: app
        run: |
          npm install
          npm run preparar
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#5b2a9a' --splashBackgroundColor '#1a0b2e' || echo "Iconos: se usan los de serie"
          npm run ajustar
          npx cap sync android

      - name: Compilar APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk Zafios-Kart.apk

      - name: Publicar en Releases (descarga directa)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Zafios Kart 1.0.${{ github.run_number }}
          body: APK de Zafios Kart. Descárgalo desde el móvil e instálalo.
          files: Zafios-Kart.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Zafios-Kart-APK
          path: Zafios-Kart.apk
