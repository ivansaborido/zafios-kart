name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Zafios_Kart.html', 'app/**']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - name: Preparar la app
        working-directory: app
        run: |
          npm install
          npm run preparar
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#5b2a9a' --splashBackgroundColor '#1a0b2e' || echo "Iconos: se usan los de serie"
          npm run ajustar
          npx cap sync android

      - name: Compilar APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk Zafios-Kart.apk

      - name: Publicar en Releases (descarga directa)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Zafios Kart 1.0.${{ github.run_number }}
          body: APK de Zafios Kart. Descárgalo desde el móvil e instálalo.
          files: Zafios-Kart.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Zafios-Kart-APK
          path: Zafios-Kart.apk
